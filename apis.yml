aid: cava
name: CAVA
description: 'CAVA Group, Inc. (NYSE: CAVA) is a Washington, D.C.-headquartered Mediterranean
  fast-casual restaurant company that operates the CAVA brand, serving customizable
  bowls, pitas, salads and sides built on house-made dips, spreads and dressings. Alongside
  its restaurants CAVA runs a consumer packaged goods line sold in grocery stores,
  a digital ordering and delivery channel, a catering business at catering.cava.com,
  and the CAVA Rewards loyalty program delivered through its iOS and Android apps.
  The company listed on the New York Stock Exchange in June 2023 and reports an in-house
  technology program — CavaCore, its data platform, and CAVA Current, a restaurant
  operating system. CAVA publishes no public developer program, API documentation,
  or machine-readable API contract; its public machine-readable surface is limited
  to an RFC 9116 security.txt and a published llms.txt.'
